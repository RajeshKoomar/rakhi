<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Raksha Bandhan 💛</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600;700&family=Dancing+Script:wght@700&display=swap"
        rel="stylesheet" />
    <style>
        /* ══ RESET ═════════════════════════════════════════════════ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f5a623;
            --crimson: #d94f3d;
            --rose: #f7816a;
            --cream: #fff8ee;
            --bg: #120600;
            --glow: 0 0 40px rgba(245, 166, 35, .5);
            --glow-sm: 0 0 18px rgba(245, 166, 35, .35);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--cream);
            overflow-x: hidden;
            cursor: none;
            
        }

        /* ══ CUSTOM CURSOR ═════════════════════════════════════════ */
        #cursor {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: radial-gradient(circle, #f5a623, #d94f3d);
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
            transition: transform .08s;
        }

        #cursor-ring {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1.5px solid rgba(245, 166, 35, .5);
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: left .1s, top .1s;
        }

        body * {
            cursor: none;
        }

        /* ══ DISABLE CUSTOM CURSOR ON TOUCH / MOBILE ═══════════════ */
        @media (pointer: coarse) {

            body,
            body * {
                cursor: auto !important;
            }

            #cursor,
            #cursor-ring {
                display: none !important;
            }
        }

        /* ══ CLICK BURST ════════════════════════════════════════════ */
        .burst {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9990;
            animation: burstFly .7s ease forwards;
        }

        @keyframes burstFly {
            to {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* ══ PETALS ════════════════════════════════════════════════ */
        #petals-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ══ NAV ═══════════════════════════════════════════════════ */
        .nav-dots {
            position: fixed;
            right: 22px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 13px;
            z-index: 500;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(245, 166, 35, .3);
            border: 1.5px solid var(--gold);
            cursor: pointer;
            transition: .3s;
        }

        .dot.active {
            background: var(--gold);
            transform: scale(1.4);
            box-shadow: var(--glow-sm);
        }

        /* ══ SECTIONS ══════════════════════════════════════════════ */
        section {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            overflow: hidden;
        }

        .section-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.2rem, 5vw, 3.6rem);
            color: var(--gold);
            margin-bottom: 50px;
            text-align: center;
            text-shadow: 0 0 24px #f5a62360;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* ══ SCROLL REVEAL ══════════════════════════════════════════ */
        .rv {
            opacity: 0;
            transform: translateY(50px);
            transition: opacity .9s ease, transform .9s cubic-bezier(.25, .8, .25, 1);
        }

        .rv-l {
            opacity: 0;
            transform: translateX(-60px);
            transition: opacity .9s ease, transform .9s cubic-bezier(.25, .8, .25, 1);
        }

        .rv-r {
            opacity: 0;
            transform: translateX(60px);
            transition: opacity .9s ease, transform .9s cubic-bezier(.25, .8, .25, 1);
        }

        .rv-s {
            opacity: 0;
            transform: scale(.82);
            transition: opacity .9s ease, transform .9s cubic-bezier(.34, 1.56, .64, 1);
        }

        .rv.show,
        .rv-l.show,
        .rv-r.show,
        .rv-s.show {
            opacity: 1;
            transform: none;
        }

        /* ═════════════════════════════════════════════════════════════
       INTRO SPLASH — RAKHI ANIMATION
    ═══════════════════════════════════════════════════════════════ */
        #intro {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #3b1900 0%, #120600 75%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            transition: opacity .8s ease, visibility .8s ease;
        }

        #intro.gone {
            opacity: 0;
            visibility: hidden;
        }

        /* Animated Rakhi charm */
        .intro-rakhi-wrap {
            width: 160px;
            height: 160px;
            background: conic-gradient(from 0deg, #8b1a1a, #c8922a, #f5a623, #fff8dc, #f5a623, #c8922a, #8b1a1a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: rakhi-spin 10s linear infinite;
            box-shadow: 0 0 60px rgba(245, 166, 35, .6);
        }

        .intro-rakhi-inner {
            width: 130px;
            height: 130px;
            background: radial-gradient(circle at 38% 38%, #fff8dc, #f5a623, #c77a1a 70%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.6rem;
            box-shadow: inset 0 0 30px rgba(255, 255, 255, .35);
            animation: rakhi-glow 2s ease infinite alternate;
        }

        @keyframes rakhi-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rakhi-glow {
            from {
                box-shadow: inset 0 0 30px rgba(255, 255, 255, .25), 0 0 30px #f5a62360;
            }

            to {
                box-shadow: inset 0 0 30px rgba(255, 255, 255, .55), 0 0 60px #f5a623cc;
            }
        }

        /* Thread stretching across intro */
        .intro-thread-wrap {
            position: relative;
            width: 320px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .intro-thread {
            height: 5px;
            background: linear-gradient(90deg, #dc143c, #f5a623, #dc143c, #f5a623, #dc143c);
            border-radius: 3px;
            width: 0;
            animation: threadStretch 1.4s cubic-bezier(.4, 0, .2, 1) .4s forwards;
        }

        @keyframes threadStretch {
            to {
                width: 100%;
            }
        }

        /* Knot nodes */
        .intro-knot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--gold);
            position: absolute;
            box-shadow: 0 0 10px #f5a623;
            animation: knotPop .5s cubic-bezier(.34, 1.56, .64, 1) forwards;
            transform: scale(0);
        }

        .intro-knot:nth-child(1) {
            left: 0;
            animation-delay: .6s;
        }

        .intro-knot:nth-child(2) {
            left: 50%;
            transform: translateX(-50%) scale(0);
            animation-delay: .9s;
            animation-name: knotPopMid;
        }

        .intro-knot:nth-child(3) {
            right: 0;
            animation-delay: 1.2s;
        }

        @keyframes knotPop {
            to {
                transform: scale(1);
            }
        }

        @keyframes knotPopMid {
            to {
                transform: translateX(-50%) scale(1);
            }
        }

        .intro-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.2rem, 6vw, 4rem);
            background: linear-gradient(135deg, #f5a623, #fff5cc, #d94f3d, #f5a623);
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradShift 3s ease infinite;
            text-align: center;
            opacity: 0;
            animation: gradShift 3s ease infinite, fadeUp .8s ease .3s forwards;
        }

        @keyframes gradShift {

            0%,
            100% {
                background-position: 0%
            }

            50% {
                background-position: 100%
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .intro-sub {
            font-family: 'Playfair Display', serif;
            font-size: clamp(.9rem, 2vw, 1.2rem);
            color: #ffe9b0cc;
            text-align: center;
            opacity: 0;
            animation: fadeUp .8s ease .7s forwards;
        }

        .intro-btn {
            margin-top: 10px;
            padding: 14px 44px;
            background: linear-gradient(135deg, #f5a623, #d94f3d);
            border: none;
            border-radius: 50px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.3rem;
            color: #fff;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 0 30px rgba(245, 166, 35, .5);
            opacity: 0;
            animation: fadeUp .8s ease 1.1s forwards;
            transition: transform .25s, box-shadow .25s;
        }

        .intro-btn:hover {
            transform: scale(1.07);
            box-shadow: 0 0 50px rgba(245, 166, 35, .8);
        }



        /* ══ CINEMATIC GIFT REVEAL ═══════════════════════════════════ */
        .gift-transition {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 48%, rgba(245,166,35,.18), transparent 18%),
                radial-gradient(circle at 50% 50%, #542000 0%, #1b0800 42%, #070200 100%);
            overflow: hidden;
            pointer-events: none;
            isolation: isolate;
        }

        .gift-transition.show {
            display: flex;
            animation: cinematicIn .55s ease-out both;
        }

        .gift-vignette {
            position: absolute;
            inset: -10%;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.72) 82%);
            z-index: 1;
        }

        .gift-aura {
            position: absolute;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,244,178,.34), rgba(245,166,35,.13) 35%, transparent 68%);
            filter: blur(2px);
            animation: auraPulse 1.8s ease-in-out infinite;
            z-index: 2;
        }

        .gift-rays {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: repeating-conic-gradient(
                from 0deg,
                rgba(255,230,130,.0) 0deg 9deg,
                rgba(255,220,100,.18) 9.5deg 10.5deg,
                rgba(255,230,130,.0) 11deg 20deg
            );
            animation: raysSpin 18s linear infinite;
            opacity: .65;
            z-index: 2;
        }

        .gift-stage {
            position: relative;
            width: 270px;
            height: 300px;
            z-index: 5;
            transform: translateY(70px) scale(.55);
            animation: stageEnter 1s cubic-bezier(.18,1.45,.35,1) .1s forwards;
        }

        .gift-shadow {
            position: absolute;
            left: 28px;
            bottom: 12px;
            width: 214px;
            height: 34px;
            border-radius: 50%;
            background: rgba(0,0,0,.62);
            filter: blur(14px);
            animation: shadowBreath 1.8s ease-in-out infinite;
        }

        .gift-box {
            position: absolute;
            left: 45px;
            bottom: 40px;
            width: 180px;
            height: 150px;
            transform-style: preserve-3d;
        }

        .gift-body {
            position: absolute;
            left: 10px;
            top: 35px;
            width: 160px;
            height: 112px;
            border-radius: 6px 6px 18px 18px;
            background: linear-gradient(145deg, #8d1421, #d94f3d 42%, #9c1725);
            border: 2px solid rgba(255,213,100,.85);
            box-shadow:
                inset 12px 12px 20px rgba(255,255,255,.10),
                inset -14px -12px 25px rgba(75,0,0,.22),
                0 14px 30px rgba(0,0,0,.3);
        }

        .gift-body::before {
            content: "";
            position: absolute;
            left: 65px;
            top: -1px;
            width: 28px;
            height: 110%;
            background: linear-gradient(90deg, #d9971c, #fff2aa 45%, #c57a12);
            box-shadow: 0 0 12px rgba(255,218,104,.25);
        }

        .gift-lid {
            position: absolute;
            left: 0;
            top: 17px;
            width: 180px;
            height: 43px;
            border-radius: 9px;
            background: linear-gradient(145deg, #a91829, #ed6749 48%, #8c1220);
            border: 2px solid #ffd76a;
            box-shadow: 0 8px 18px rgba(0,0,0,.32);
            transform-origin: 13% 90%;
            z-index: 5;
            animation: lidCinematicOpen .95s cubic-bezier(.2,.9,.25,1) .72s forwards;
        }

        .gift-lid::before {
            content: "";
            position: absolute;
            left: 75px;
            top: 0;
            width: 28px;
            height: 100%;
            background: linear-gradient(90deg, #d9971c, #fff2aa 45%, #c57a12);
        }

        .gift-bow {
            position: absolute;
            left: 58px;
            top: -3px;
            width: 64px;
            height: 52px;
            z-index: 8;
            animation: bowCinematicOpen .95s cubic-bezier(.2,.9,.25,1) .72s forwards;
            transform-origin: 50% 88%;
        }

        .gift-bow::before,
        .gift-bow::after {
            content: "";
            position: absolute;
            top: 8px;
            width: 39px;
            height: 33px;
            background: linear-gradient(135deg, #ef6a48, #a91628);
            border: 2px solid #ffd76a;
            box-shadow: inset 5px 5px 8px rgba(255,255,255,.12);
        }

        .gift-bow::before {
            left: -3px;
            border-radius: 85% 20% 75% 25%;
            transform: rotate(25deg);
        }

        .gift-bow::after {
            right: -3px;
            border-radius: 20% 85% 25% 75%;
            transform: rotate(-25deg);
        }

        .gift-bow-center {
            position: absolute;
            left: 22px;
            top: 14px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff5b8, #f5a623 50%, #b86d0d);
            border: 2px solid #fff1a8;
            box-shadow: 0 0 18px rgba(255,210,80,.7);
            z-index: 10;
        }

        .gift-inside {
            position: absolute;
            left: 28px;
            top: 44px;
            width: 124px;
            height: 58px;
            border-radius: 50%;
            background: radial-gradient(ellipse, #fff7c8, #f5a623 45%, transparent 70%);
            opacity: 0;
            z-index: 4;
            animation: insideGlow .9s ease 1s forwards;
        }

        .gift-heart {
            position: absolute;
            left: 50%;
            top: 43%;
            font-size: 3rem;
            transform: translate(-50%, 20px) scale(.2);
            opacity: 0;
            z-index: 12;
            filter: drop-shadow(0 0 20px rgba(255,215,100,.9));
            animation: heartRise 1.15s cubic-bezier(.2,1.3,.35,1) 1.05s forwards;
        }

        .gift-message {
            position: absolute;
            top: 51%;
            left: 50%;
            width: min(90vw, 700px);
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2rem, 5vw, 3.6rem);
            color: #fff5cc;
            text-shadow: 0 0 25px rgba(245,166,35,.85);
            opacity: 0;
            transform: translate(-50%, 30px);
            z-index: 14;
            animation: messageReveal 1s ease 1.35s forwards;
        }

        .gift-particles {
            position: absolute;
            inset: 0;
            z-index: 13;
        }

        .gift-particle {
            position: absolute;
            left: 50%;
            top: 49%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffd76a;
            box-shadow: 0 0 12px #f5a623;
            opacity: 0;
            animation: particleFly var(--dur) cubic-bezier(.15,.8,.25,1) var(--delay) forwards;
        }

        .gift-particle:nth-child(3n) {
            width: 5px;
            height: 12px;
            border-radius: 3px;
            background: #fff3bd;
        }

        .gift-transition.finish {
            animation: cinematicOut 1s cubic-bezier(.4,0,.2,1) forwards;
        }

        @keyframes cinematicIn {
            from { opacity: 0; transform: scale(1.04); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes cinematicOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.12); visibility: hidden; }
        }

        @keyframes auraPulse {
            0%,100% { transform: scale(.86); opacity: .55; }
            50% { transform: scale(1.12); opacity: 1; }
        }

        @keyframes raysSpin {
            to { transform: rotate(360deg); }
        }

        @keyframes stageEnter {
            0% { opacity: 0; transform: translateY(100px) scale(.5) rotateX(12deg); }
            65% { opacity: 1; transform: translateY(-10px) scale(1.04) rotateX(0); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes shadowBreath {
            0%,100% { transform: scaleX(.8); opacity: .42; }
            50% { transform: scaleX(1.05); opacity: .7; }
        }

        @keyframes lidCinematicOpen {
            0% { transform: rotate(0) translate(0,0); }
            55% { transform: rotate(-24deg) translate(-20px,-28px); }
            100% { transform: rotate(-34deg) translate(-42px,-105px); }
        }

        @keyframes bowCinematicOpen {
            0% { transform: rotate(0) scale(1); }
            100% { transform: rotate(-17deg) translate(-36px,-96px) scale(.82); }
        }

        @keyframes insideGlow {
            0% { opacity: 0; transform: scale(.5); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        @keyframes heartRise {
            0% { opacity: 0; transform: translate(-50%, 30px) scale(.2); }
            45% { opacity: 1; transform: translate(-50%, -18px) scale(1.18); }
            100% { opacity: 1; transform: translate(-50%, -55px) scale(1); }
        }

        @keyframes messageReveal {
            from { opacity: 0; transform: translate(-50%, 30px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        @keyframes particleFly {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(0deg) scale(.2);
            }
            12% { opacity: 1; }
            100% {
                opacity: 0;
                transform:
                    translate(calc(-50% + var(--x)), calc(-50% + var(--y)))
                    rotate(var(--r)) scale(1);
            }
        }

        @media (max-width: 600px) {
            .gift-aura { width: 270px; height: 270px; }
            .gift-rays { width: 430px; height: 430px; }
            .gift-stage { transform: translateY(70px) scale(.5); }
            .gift-message { top: 57%; }
        }

        @media (prefers-reduced-motion: reduce) {
            .gift-transition *,
            .gift-transition {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
            }
        }

        /* Sparkle dots on intro */
        .intro-spark {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, #f5a623, transparent);
            animation: sparkFloat linear infinite;
            pointer-events: none;
        }

        @keyframes sparkFloat {
            0% {
                transform: translateY(0) scale(1);
                opacity: .9;
            }

            100% {
                transform: translateY(-120px) scale(0);
                opacity: 0;
            }
        }

        /* ═════════════════════════════════════════════════════════════
       HERO
    ═══════════════════════════════════════════════════════════════ */
        #hero {
            background: radial-gradient(ellipse at 50% 60%, #3b1900, #120600 70%);
            text-align: center;
        }

        .lantern-string {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
        }

        .lantern {
            font-size: 2.2rem;
            animation: lSwing 2.5s ease-in-out infinite alternate;
            transform-origin: top center;
            filter: drop-shadow(0 4px 14px #f5a62388);
        }

        .lantern:nth-child(2) {
            animation-delay: .4s
        }

        .lantern:nth-child(3) {
            animation-delay: .8s
        }

        .lantern:nth-child(4) {
            animation-delay: 1.2s
        }

        .lantern:nth-child(5) {
            animation-delay: 1.6s
        }

        @keyframes lSwing {
            from {
                transform: rotate(-14deg)
            }

            to {
                transform: rotate(14deg)
            }
        }

        .diya-row {
            display: flex;
            gap: 28px;
            margin-bottom: 20px;
            animation: sway 3s ease-in-out infinite alternate;
        }

        .diya {
            font-size: 2.6rem;
            filter: drop-shadow(0 0 14px #f5a623cc);
        }

        @keyframes sway {
            from {
                transform: rotate(-5deg)
            }

            to {
                transform: rotate(5deg)
            }
        }

        .hero-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3rem, 9vw, 7rem);
            background: linear-gradient(135deg, #f5a623, #fff5cc, #d94f3d, #f5a623);
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradShift 4s ease infinite, hFade 1.5s ease forwards;
            opacity: 0;
            line-height: 1.1;
        }

        .hero-name {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2rem, 6vw, 4.5rem);
            color: #ffe0a0;
            opacity: 0;
            animation: hFade 1.5s ease .4s forwards;
            text-shadow: 0 0 30px #f5a62380;
        }

        .hero-sub {
            font-family: 'Playfair Display', serif;
            font-size: clamp(.95rem, 2.5vw, 1.4rem);
            color: #ffe9b0cc;
            margin-top: 14px;
            opacity: 0;
            animation: hFade 1.5s ease .8s forwards;
        }

        .hero-badge {
            margin-top: 30px;
            display: inline-block;
            padding: 12px 38px;
            border: 2px solid var(--gold);
            border-radius: 50px;
            font-size: .95rem;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            animation: hFade 1.5s ease 1.2s forwards;
            box-shadow: var(--glow);
            backdrop-filter: blur(6px);

        @keyframes hFade {
            from {
                opacity: 0;

            }

            to {
                opacity: 1;
                transform: none
            }
        }

        /* ═════════════════════════════════════════════════════════════
       PHOTO GALLERY  — Proper card grid + featured viewer
    ═══════════════════════════════════════════════════════════════ */
        #gallery {
            background: linear-gradient(160deg, #1e0900, #3a1200, #120600);
            padding: 100px 20px;
        }

        /* --- Featured viewer (top) --- */
        .featured-wrap {
            width: min(860px, 95vw);
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 30px 80px rgba(0, 0, 0, .7), 0 0 0 2px rgba(245, 166, 35, .3);
            aspect-ratio: 16/9;
            margin-bottom: 30px;
        }

        .featured-wrap img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            transition: opacity .7s ease, transform .7s ease;
            transform: scale(1.03);
        }

        .featured-wrap img.f-active {
            opacity: 1;
            transform: scale(1);
            z-index: 2;
        }

        .featured-wrap img.f-hidden {
            opacity: 0;
            transform: scale(1.05);
            z-index: 1;
        }

        /* caption overlay */
        .featured-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 5;
            background: linear-gradient(to top, rgba(18, 6, 0, .9) 0%, transparent 100%);
            padding: 28px 24px 20px;
            pointer-events: none;
        }

        .featured-caption .fc-name {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.6rem, 4vw, 2.6rem);
            color: #fff;
            text-shadow: 0 2px 20px rgba(0, 0, 0, .8);
        }

        .featured-caption .fc-num {
            font-size: .82rem;
            letter-spacing: 2px;
            color: rgba(245, 166, 35, .8);
            margin-top: 4px;
        }

        /* Arrow buttons */
        .fv-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .45);
            border: 2px solid rgba(245, 166, 35, .5);
            color: var(--gold);
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background .3s, transform .3s, box-shadow .3s;
        }

        .fv-arrow:hover {
            background: var(--gold);
            color: #120600;
            transform: translateY(-50%) scale(1.12);
            box-shadow: var(--glow);
        }

        #fvPrev {
            left: 14px
        }

        #fvNext {
            right: 14px
        }

        /* Gold frame border overlay */
        .featured-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 3px solid rgba(245, 166, 35, .18);
            border-radius: 20px;
            z-index: 6;
            pointer-events: none;
        }

        /* --- Thumbnail row (below) --- */
        .thumb-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            width: min(860px, 95vw);
        }

        .thumb-card {
            position: relative;
            flex: 0 0 calc(20% - 10px);
            min-width: 100px;
            aspect-ratio: 3/4;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 2.5px solid transparent;
            transition: border-color .3s, transform .3s, box-shadow .3s;
            background: #000;
        }

        .thumb-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
            filter: brightness(.75) saturate(.9);
            transition: filter .35s, transform .35s;
        }

        .thumb-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(18, 6, 0, .6), transparent 60%);
        }

        .thumb-card:hover img {
            filter: brightness(1) saturate(1.1);
            transform: scale(1.06);
        }

        .thumb-card.active {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(245, 166, 35, .5);
        }

        .thumb-card.active img {
            filter: brightness(1) saturate(1.1);
        }

        .thumb-num {
            position: absolute;
            bottom: 7px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: .95rem;
            color: #fff;
            z-index: 2;
            text-shadow: 0 1px 6px rgba(0, 0, 0, .8);
        }

        /* ═════════════════════════════════════════════════════════════
       LIGHTBOX
    ═══════════════════════════════════════════════════════════════ */
        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(18, 6, 0, .96);
            z-index: 1500;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        #lightbox.open {
            display: flex;
            animation: fadeIn .3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        #lb-img {
            max-width: 92vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 0 80px rgba(245, 166, 35, .3);
            animation: zoomIn .35s cubic-bezier(.34, 1.56, .64, 1);
        }

        @keyframes zoomIn {
            from {
                transform: scale(.75);
                opacity: 0
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        #lb-close {
            position: absolute;
            top: 20px;
            right: 26px;
            font-size: 2.2rem;
            color: var(--gold);
            cursor: pointer;
            transition: transform .2s;
        }

        #lb-close:hover {
            transform: rotate(90deg) scale(1.2);
        }

        /* ═════════════════════════════════════════════════════════════
       RAKHI SECTION
    ═══════════════════════════════════════════════════════════════ */
        #rakhi-section {
            background: radial-gradient(ellipse at 30% 70%, #3b0f0f, #120600 60%);
            text-align: center;
        }

            }

        .thread {

            }

        .rakhi-msg {

        }

        /* ═════════════════════════════════════════════════════════════
       LETTER
    ═══════════════════════════════════════════════════════════════ */
        #letter-section {
            background: linear-gradient(160deg, #120600, #2d1000, #120600);
        }

        .letter-env {
            width: min(720px, 92vw);
            background: linear-gradient(145deg, rgba(255, 248, 238, .09), rgba(255, 200, 100, .05));
            border: 1px solid rgba(245, 166, 35, .3);
            border-radius: 18px;
            padding: 52px 50px;
            position: relative;
            backdrop-filter: blur(12px);
            box-shadow: 0 24px 70px rgba(0, 0, 0, .45), var(--glow);
        }

        .letter-env::before {
            content: '✦';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg);
            padding: 0 14px;
            font-size: 1.5rem;
            color: var(--gold);
        }

        .lt {
            font-family: 'Playfair Display', serif;
            font-size: clamp(.95rem, 2vw, 1.12rem);
            line-height: 2.3;
            color: #ffe9b0;
        }

        .lt .hl {
            color: var(--gold);
            font-style: italic;
        }

        .lt-sig {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: var(--gold);
            margin-top: 30px;
            text-align: right;
        }

        /* ═════════════════════════════════════════════════════════════
       WISHES
    ═══════════════════════════════════════════════════════════════ */
        #wishes {
            background: radial-gradient(ellipse at 70% 30%, #3b1500, #120600 70%);
        }

        .wishes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(265px, 1fr));
            gap: 22px;
            width: min(1040px, 92vw);
        }

        .wish-card {
            background: rgba(255, 248, 238, .07);
            border: 1px solid rgba(245, 166, 35, .2);
            border-radius: 18px;
            padding: 34px 24px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform .4s, box-shadow .4s, border-color .4s;
            position: relative;
            overflow: hidden;
        }

        .wish-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(245, 166, 35, .12), transparent 70%);
            opacity: 0;
            transition: opacity .4s;
        }

        .wish-card:hover::before {
            opacity: 1;
        }

        .wish-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: var(--glow);
            border-color: var(--gold);
        }

        .wish-icon {
            font-size: 2.6rem;
            margin-bottom: 14px;
            display: block;
        }

        .wish-title {
            font-family: 'Dancing Script', cursive;
            font-size: 1.6rem;
            color: var(--gold);
            margin-bottom: 10px;
        }

        .wish-text {
            font-size: .9rem;
            color: #ffe9b077;
            line-height: 1.75;
        }

        /* ═════════════════════════════════════════════════════════════
       FIREWORKS
    ═══════════════════════════════════════════════════════════════ */
        #fireworks-section {
            background: linear-gradient(
                180deg,
                rgba(8, 2, 0, .15) 0%,
                #1a0700 22%,
                #3b1400 50%,
                #170600 78%,
                #050100 100%
            );
            text-align: center;
            position: relative;
        }

        #fw-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .fw-content {
            position: relative;
            z-index: 2;
        }

        .big-wish {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.5rem, 7vw, 5.5rem);
            background: linear-gradient(135deg, #f5a623, #fff5b0, #d94f3d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: pulseGlow 2s ease infinite;
        }

        @keyframes pulseGlow {

            0%,
            100% {
                filter: brightness(1) drop-shadow(0 0 10px #f5a62366)
            }

            50% {
                filter: brightness(1.4) drop-shadow(0 0 30px #f5a623bb)
            }
        }

        .count-badge {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
            background: rgba(255, 248, 238, .07);
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 22px 48px;
            backdrop-filter: blur(10px);
        }

        .cb-label {
            font-size: .88rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold);
        }

        .cb-num {
            font-size: 3.2rem;
            font-weight: 700;
            color: #fff8dc;
            line-height: 1;
        }

        .cb-sub {
            font-size: .85rem;
            color: #ffe9b088;
        }

        /* ═══ FOOTER ═════════════════════════════════════════════════ */
        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 16px 20px;
            background: rgba(8, 2, 0, .58);
            color: #ffe9b055;
            font-size: .78rem;
            line-height: 1.4;
            /* backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px); */
            border-top: 1px solid rgba(245, 166, 35, .16);
        }

        footer .heart {
            color: var(--crimson)
        }

        footer .sis {
            color: var(--gold)
        }

        /* ═══ MUSIC BUTTON ═══════════════════════════════════════════ */
        #musicToggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(20, 5, 0, 0.7);
            border: 2px solid var(--gold);
            color: var(--gold);
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 3000;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(245, 166, 35, 0.4);
            transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
        }

        #musicToggle:hover {
            transform: scale(1.1);
            background: var(--gold);
            color: #120600;
            box-shadow: 0 0 30px rgba(245, 166, 35, 0.7);
        }



        /* ══ PREMIUM RAKHI SCROLL JOURNEY ═══════════════════════════ */
        #scroll-rakhi-track {
            position: fixed;
            right: 24px;
            top: 13%;
            width: 76px;
            height: 74%;
            z-index: 700;
            pointer-events: none;
            opacity: 0;
            transition: opacity .55s ease, transform .55s ease;
        }

        #scroll-rakhi-track.visible {
            opacity: 1;
        }

        #scroll-rakhi-thread {
            position: absolute;
            left: 50%;
            top: 0;
            width: 4px;
            height: 100%;
            transform: translateX(-50%);
            border-radius: 100%;
            background:
                repeating-linear-gradient(
                    135deg,
                    #8b1720 0 8px,
                    #d94f3d 8px 16px,
                    #f5a623 16px 24px,
                    #fff0b0 24px 28px,
                    #f5a623 28px 36px,
                    #d94f3d 36px 44px
                );
            box-shadow:
                0 0 7px rgba(245,166,35,.65),
                0 0 18px rgba(245,166,35,.28);
            opacity: .72;
        }

        #scroll-rakhi-thread::before,
        #scroll-rakhi-thread::after {
            content: "";
            position: absolute;
            left: 50%;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transform: translateX(-50%);
            background: #f5a623;
            box-shadow: 0 0 14px #f5a623;
        }

        #scroll-rakhi-thread::before { top: 0; }
        #scroll-rakhi-thread::after { bottom: 0; }

        #scroll-rakhi {
            position: absolute;
            left: 50%;
            top: 0;
            width: 62px;
            height: 62px;
            transform: translate(-50%, -50%) rotate(0deg);
            display: grid;
            place-items: center;
            border-radius: 50%;
            font-size: 1.65rem;
            background:
                radial-gradient(circle at 33% 28%,
                    #fffce5 0 8%,
                    #ffd76a 18%,
                    #f5a623 38%,
                    #d94f3d 58%,
                    #8b1720 76%,
                    #4c090f 100%);
            border: 3px solid #ffe9a0;
            box-shadow:
                0 0 8px #fff1a8,
                0 0 20px #f5a623,
                0 0 48px rgba(245,166,35,.65),
                inset 0 0 16px rgba(255,255,255,.42);
            transition: top .2s cubic-bezier(.22,.7,.25,1),
                        margin-left .2s ease-out;
            animation: scrollRakhiFloat 2.1s ease-in-out infinite;
        }

        #scroll-rakhi::before,
        #scroll-rakhi::after {
            content: "✦";
            position: absolute;
            color: #fff3b0;
            font-size: .8rem;
            text-shadow: 0 0 9px #f5a623;
            animation: rakhiTwinkle 1.5s ease-in-out infinite;
        }

        #scroll-rakhi::before {
            left: -19px;
            top: 1px;
        }

        #scroll-rakhi::after {
            right: -19px;
            bottom: 1px;
            animation-delay: .65s;
        }

        .scroll-rakhi-particle {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ffe9a0;
            box-shadow: 0 0 9px #f5a623;
            opacity: 0;
            animation: rakhiTrail 1.65s ease-out infinite;
            animation-delay: var(--delay);
        }

        @keyframes scrollRakhiFloat {
            0%,100% { margin-top: 0; }
            50% { margin-top: -5px; }
        }

        @keyframes rakhiTwinkle {
            0%,100% { opacity: .25; transform: scale(.65) rotate(0); }
            50% { opacity: 1; transform: scale(1.35) rotate(90deg); }
        }

        @keyframes rakhiTrail {
            0% {
                opacity: 0;
                transform: translate(-50%,-50%) scale(.2);
            }
            18% { opacity: .9; }
            100% {
                opacity: 0;
                transform: translate(
                    calc(-50% + var(--dx)),
                    calc(-50% + var(--dy))
                ) scale(0);
            }
        }

        @media (max-width: 700px) {
            #scroll-rakhi-track {
                right: 4px;
                width: 60px;
                top: 18%;
                height: 62%;
                transform: scale(.78);
                transform-origin: right center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #scroll-rakhi {
                animation: none;
            }
            .scroll-rakhi-particle {
                animation: none;
                opacity: .4;
            }
        }

        /* ═══ RESPONSIVE ═════════════════════════════════════════════ */
        @media(max-width:600px) {
            .thumb-card {
                flex: 0 0 calc(33.33% - 9px)
            }

            .letter-env {
                padding: 30px 22px
            }

            .featured-wrap {
                aspect-ratio: 4/3
            }
        }

        #fireworks-section::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 110px;
            background: linear-gradient(
                180deg,
                rgba(8,2,0,.92) 0%,
                rgba(26,7,0,.45) 45%,
                transparent 100%
            );
            pointer-events: none;
            z-index: 1;
        }

        #fireworks-section .fw-content {
            position: relative;
            z-index: 3;
        }
</style>

    <script>
        // ══════════════════════════════════════════════════
        //  ★  CONFIG  ★  — edit here
        // ══════════════════════════════════════════════════
        const SIS_NAME = 'Anjali';   // Sister's name

        const PHOTOS = [
            { src: 'images/WhatsApp Image 2026-08-25 at 7.38.29 AM (1).jpeg', caption: `My Cutest Sis  ${SIS_NAME} 🌸` },
            { src: 'images/WhatsApp Image 2026-08-25 at 7.38.29 AM.jpeg', caption: `Radiant Always ✨` },
            { src: 'images/WhatsApp Image 2026-08-25 at 7.38.49 AM (1).jpeg', caption: `Golden Heart 💛` },
            { src: 'images/WhatsApp Image 2026-08-25 at 7.38.49 AM (2).jpeg', caption: `Warm Moments 🏮` },
            { src: 'images/WhatsApp Image 2026-08-25 at 7.38.49 AM.jpeg', caption: `Forever Blessed 🙏` },
        ];

        const WISHES = [
            { icon: '🌸', title: 'Joy & Happiness', text: `May every morning bring fresh happiness to your heart,and every night be filled with peaceful dreams.` },
            { icon: '💰', title: 'Prosperity', text: `May abundance flow into your life — in love, health and every blessing you deserve.` },
            { icon: '🛡️', title: 'Protection', text: `Though miles apart, my prayers wrap around you like armor. May you always feel safe.` },
            { icon: '❤️', title: 'Endless Love', text: `Distance is just a number. My love for you,crosses every mile and every border.` },
            { icon: '🌟', title: 'Bright Future', text: `May every dream you've painted shine into reality — you deserve all the stars.` },
            { icon: '🏠', title: 'Reunion Soon', text: `One day soon we'll celebrate together in person. Until then, this Rakhi carries all my hugs.` },
        ];

        // ══════════════════════════════════════════════════
        //  FILL TEXT
        // ══════════════════════════════════════════════════
        document.title = `Happy Raksha Bandhan 💛 My Cutest Sister ${SIS_NAME}`;
        document.getElementById('introTitle').textContent = `Happy Raksha Bandhan`;
        document.getElementById('introSub').textContent = `For my cutest sister ${SIS_NAME} 🌺`;
        document.getElementById('heroName').textContent = `My Cutest Chocolaty Sister ${SIS_NAME} 🌺`;
        document.getElementById('heroSub').textContent = `With all my love from across every mile on this Raksha Bandhan`;
        document.getElementById('galTitle').textContent = `✨ ${SIS_NAME}'s Precious Memories 📸`;
        document.getElementById('wishName').textContent = SIS_NAME;
        document.getElementById('bigWish').textContent = ` Happy Rakhi to My Cutest Sis 🌸 ${SIS_NAME} 🌸`;
        document.getElementById('rMsg').innerHTML =
            `This Rakhi thread is more than silk and colors — it carries the warmth of my heart, the prayers of my soul, and the promise that no distance can weaken the bond we share. I tie this Rakhi across every mile that separates us.`;
        document.getElementById('letterEnv').innerHTML = `
  <p class="lt">
    Dear <span class="hl">${SIS_NAME}</span>,<br/><br/>
    Today the world celebrates Raksha Bandhan, and <span class="hl">even though miles lay between us</span>,
    my heart has traveled every one of them just to reach you. 🌸<br/><br/>
    I close my eyes and I can see you smiling that radiant & warm smile
    that makes everything feel okay. I tie this Rakhi <span class="hl">on my wrist, across the distance</span>,
    with a prayer that you stay surrounded by love, laughter, and every happiness you deserve.<br/><br/>
    Distance can separate our bodies, but <span class="hl">it can never separate our hearts</span>.
    You are my guiding star, my biggest cheerleader, my forever safe place. On this special day,
    I promise to always be there for you — in every way I can, from wherever I am.<br/><br/>
    May this Raksha Bandhan bring you all the joy you deserve. 🪔
    <span class="hl">You are always in my prayers, always in my heart.
  </p>
  <div class="lt-sig">Your Brother 💛</div>
`;
        document.getElementById('footer').innerHTML =
            `Made with <span class="heart">♥</span> for <span class="sis">${SIS_NAME}</span> &nbsp;·&nbsp; Raksha Bandhan 2026 &nbsp;·&nbsp; 🪔 May our bond shine forever`;

        // ══════════════════════════════════════════════════
        //  INTRO — sparkle particles
        // ══════════════════════════════════════════════════
        const intro = document.getElementById('intro');
        for (let i = 0; i < 22; i++) {
            const s = document.createElement('div');
            s.className = 'intro-spark';
            const sz = 4 + Math.random() * 8;
            Object.assign(s.style, {
                width: sz + 'px', height: sz + 'px',
                left: Math.random() * 100 + '%',
                top: (30 + Math.random() * 60) + '%',
                animationDuration: (1.5 + Math.random() * 2.5) + 's',
                animationDelay: Math.random() + 's',
            });
            intro.appendChild(s);
        }

        const introAudio = document.getElementById('introMusic');
        const audio = document.getElementById('bgMusic');

        // Start intro music ONLY after the complete page has loaded.
        // Note: browsers can block unmuted autoplay; the music button remains
        // available as the fallback in that case.
        const startIntroMusicAfterLoad = () => {
            if (intro.classList.contains('gone') || !introAudio.paused) return;

            introAudio.currentTime = 0;
            introAudio.play()
                .then(() => {
                    mToggle.textContent = '🔊';
                })
                .catch(() => {
                    // Autoplay policy blocked playback. It will start from
                    // the user's first interaction via the button below.
                    mToggle.textContent = '🔇';
                });
        };

        if (document.readyState === 'complete') {
            startIntroMusicAfterLoad();
        } else {
            window.addEventListener('load', startIntroMusicAfterLoad, { once: true });
        }

        document.getElementById('introBtn').addEventListener('click', (e) => {
            e.stopPropagation();

            const giftTransition = document.getElementById('giftTransition');
            const particleBox = document.getElementById('giftParticles');

            // Create a one-shot shower of glowing golden particles.
            particleBox.innerHTML = '';
            for (let i = 0; i < 46; i++) {
                const p = document.createElement('span');
                p.className = 'gift-particle';

                const angle = Math.random() * Math.PI * 2;
                const distance = 90 + Math.random() * 250;

                p.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
                p.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
                p.style.setProperty('--r', `${Math.random() * 720 - 360}deg`);
                p.style.setProperty('--dur', `${1.0 + Math.random() * .9}s`);
                p.style.setProperty('--delay', `${.85 + Math.random() * .2}s`);

                particleBox.appendChild(p);
            }

            intro.classList.add('gone');
            giftTransition.classList.add('show');

            introAudio.pause();
            introAudio.currentTime = 0;
            audio.play().catch(e => console.log('Audio autoplay blocked', e));

            // Give the box time to open and release the surprise before revealing the site.
            setTimeout(() => {
                giftTransition.classList.add('finish');
            }, 2450);

            setTimeout(() => {
                giftTransition.remove();
                intro.remove();
                window.scrollTo({ top: 0, behavior: 'instant' });
            }, 3450);
        });

        // ══════════════════════════════════════════════════
        //  MUSIC TOGGLE LOGIC
        // ══════════════════════════════════════════════════
        const mToggle = document.getElementById('musicToggle');

        mToggle.addEventListener('click', () => {
            // Check if intro is still active to toggle introMusic instead
            if (!intro.classList.contains('gone')) {
                if (introAudio.paused) {
                    introAudio.play();
                    mToggle.textContent = '🔊';
                } else {
                    introAudio.pause();
                    mToggle.textContent = '🔇';
                }
            } else {
                if (audio.paused) {
                    audio.play();
                    mToggle.textContent = '🔊';
                } else {
                    audio.pause();
                    mToggle.textContent = '🔇';
                }
            }
        });

        // ══════════════════════════════════════════════════
        //  CUSTOM CURSOR  (desktop only — disabled on touch)
        // ══════════════════════════════════════════════════
        const isTouch = window.matchMedia('(pointer: coarse)').matches;
        const cur = document.getElementById('cursor'), ring = document.getElementById('cursor-ring');
        if (!isTouch) {
            document.addEventListener('mousemove', e => {
                cur.style.left = ring.style.left = e.clientX + 'px';
                cur.style.top = ring.style.top = e.clientY + 'px';
            });
            document.addEventListener('mousedown', () => cur.style.transform = 'translate(-50%,-50%) scale(.6)');
            document.addEventListener('mouseup', () => cur.style.transform = 'translate(-50%,-50%) scale(1)');
        }

        // ══════════════════════════════════════════════════
        //  CLICK BURST
        // ══════════════════════════════════════════════════
        const bColors = ['#f5a623', '#d94f3d', '#f7816a', '#ffe0b2', '#fff5cc', '#dc143c'];
        document.addEventListener('click', e => {
            for (let i = 0; i < 14; i++) {
                const p = document.createElement('div');
                p.className = 'burst';
                const sz = 5 + Math.random() * 8, a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 90;
                p.style.cssText = `left:${e.clientX}px;top:${e.clientY}px;width:${sz}px;height:${sz}px;
      background:${bColors[Math.floor(Math.random() * bColors.length)]};
      --tx:${Math.cos(a) * d}px;--ty:${Math.sin(a) * d}px;
      animation-duration:${.5 + Math.random() * .5}s;`;
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }
        });

        // ══════════════════════════════════════════════════
        //  PETALS
        // ══════════════════════════════════════════════════
        (() => {
            const c = document.getElementById('petals-canvas');
            const ctx = c.getContext('2d');
            let W, H, ps = [];
            const shapes = ['🌸', '🍂', '✨', '🌺', '🪷', '🌼'];
            const resize = () => { W = c.width = window.innerWidth; H = c.height = window.innerHeight };
            resize(); window.addEventListener('resize', resize);
            const sp = () => ({ x: Math.random() * W, y: -30, size: 12 + Math.random() * 16, vy: .5 + Math.random() * 1.1, vx: (Math.random() - .5) * .7, rot: Math.random() * Math.PI * 2, rs: (Math.random() - .5) * .03, em: shapes[Math.floor(Math.random() * shapes.length)], a: .5 + Math.random() * .4 });
            for (let i = 0; i < 34; i++) { const p = sp(); p.y = Math.random() * H; ps.push(p); }
            const tick = () => {
                ctx.clearRect(0, 0, W, H);
                if (ps.length < 36 && Math.random() < .04) ps.push(sp());
                ps.forEach((p, i) => {
                    ctx.save(); ctx.globalAlpha = p.a; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                    ctx.font = p.size + 'px serif'; ctx.fillText(p.em, -p.size / 2, p.size / 2); ctx.restore();
                    p.y += p.vy; p.x += p.vx + Math.sin(p.y * .01) * .5; p.rot += p.rs;
                    if (p.y > H + 40) ps[i] = sp();
                });
                requestAnimationFrame(tick);
            }; tick();
        })();

        // ══════════════════════════════════════════════════
        //  NAV DOTS
        // ══════════════════════════════════════════════════
        const SECS = ['hero', 'gallery', 'rakhi-section', 'letter-section', 'wishes', 'fireworks-section'];
        const nav = document.getElementById('navDots');
        SECS.forEach((id, i) => {
            const d = document.createElement('div');
            d.className = 'dot' + (i === 0 ? ' active' : '');
            d.onclick = () => document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
            nav.appendChild(d);
        });
        const dots = nav.querySelectorAll('.dot');
        const sObs = new IntersectionObserver(entries => {
            entries.forEach(e => { if (e.isIntersecting) { const i = SECS.indexOf(e.target.id); dots.forEach((d, j) => d.classList.toggle('active', i === j)); } });
        }, { threshold: .4 });
        SECS.forEach(id => sObs.observe(document.getElementById(id)));

        // ══════════════════════════════════════════════════
        //  SCROLL REVEAL
        // ══════════════════════════════════════════════════
        const rObs = new IntersectionObserver(entries => {
            entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('show'); rObs.unobserve(e.target); } });
        }, { threshold: .12 });
        document.querySelectorAll('.rv,.rv-l,.rv-r,.rv-s').forEach(el => rObs.observe(el));

        // ══════════════════════════════════════════════════
        //  GALLERY — FEATURED VIEWER
        // ══════════════════════════════════════════════════
        (() => {
            const fw = document.getElementById('featuredWrap');
            const tr = document.getElementById('thumbRow');
            const fcN = document.getElementById('fcName');
            const fcNum = document.getElementById('fcNum');
            let cur = 0;

            // preload + build images
            const imgs = PHOTOS.map((p, i) => {
                const el = document.createElement('img');
                el.src = p.src; el.alt = p.caption;
                el.className = i === 0 ? 'f-active' : 'f-hidden';
                el.addEventListener('click', () => openLB(p.src));
                el.style.cssText = 'cursor:zoom-in;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;transition:opacity .7s ease,transform .7s ease;';
                // insert before arrows
                fw.insertBefore(el, document.getElementById('fvPrev'));
                return el;
            });

            // thumbnails
            const thumbs = PHOTOS.map((p, i) => {
                const card = document.createElement('div');
                card.className = 'thumb-card' + (i === 0 ? ' active' : '');
                const img = document.createElement('img');
                img.src = p.src; img.alt = p.caption;
                const num = document.createElement('div');
                num.className = 'thumb-num';
                num.textContent = p.caption;
                card.appendChild(img); card.appendChild(num);
                card.addEventListener('click', () => goTo(i));
                tr.appendChild(card);
                return card;
            });

            function updateCaption() {
                fcN.textContent = PHOTOS[cur].caption;
                fcNum.textContent = `${cur + 1} of ${PHOTOS.length}`;
            }
            updateCaption();

            function goTo(idx) {
                imgs[cur].className = ''; imgs[cur].style.opacity = '0'; imgs[cur].style.transform = 'scale(1.04)'; imgs[cur].style.zIndex = '1';
                thumbs[cur].classList.remove('active');
                cur = (idx + PHOTOS.length) % PHOTOS.length;
                imgs[cur].className = ''; imgs[cur].style.opacity = '1'; imgs[cur].style.transform = 'scale(1)'; imgs[cur].style.zIndex = '2';
                thumbs[cur].classList.add('active');
                updateCaption();
            }

            document.getElementById('fvPrev').onclick = e => { e.stopPropagation(); goTo(cur - 1); };
            document.getElementById('fvNext').onclick = e => { e.stopPropagation(); goTo(cur + 1); };
            setInterval(() => goTo(cur + 1), 4200);
            document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') goTo(cur - 1); if (e.key === 'ArrowRight') goTo(cur + 1); if (e.key === 'Escape') closeLB(); });
        })();

        // ══════════════════════════════════════════════════
        //  LIGHTBOX
        // ══════════════════════════════════════════════════
        const lb = document.getElementById('lightbox');
        const lbImg = document.getElementById('lb-img');
        function openLB(src) { lbImg.src = src; lb.classList.add('open'); document.body.style.overflow = 'hidden'; }
        function closeLB() { lb.classList.remove('open'); document.body.style.overflow = ''; }
        document.getElementById('lb-close').onclick = closeLB;
        lb.addEventListener('click', e => { if (e.target === lb) closeLB(); });

        // ══════════════════════════════════════════════════
        //  RAKHI on scroll
        // ══════════════════════════════════════════════════
        const rObs2 = new IntersectionObserver(entries => {
            if (entries[0].isIntersecting) {
                document.getElementById('rThread').classList.add('go');
                document.getElementById('rCharm').classList.add('go');
                rObs2.disconnect();
            }
        }, { threshold: .3 });
        rObs2.observe(document.getElementById('rakhi-section'));

        // ══════════════════════════════════════════════════
        //  WISHES GRID
        // ══════════════════════════════════════════════════
        const wg = document.getElementById('wishGrid');
        WISHES.forEach((w, i) => {
            const c = document.createElement('div');
            c.className = 'wish-card rv';
            c.style.transitionDelay = (i * .11) + 's';
            c.innerHTML = `<span class="wish-icon">${w.icon}</span><div class="wish-title">${w.title}</div><p class="wish-text">${w.text}</p>`;
            wg.appendChild(c);
            rObs.observe(c);
        });


        // ══════════════════════════════════════════════════
        //  CONTINUOUS FIREWORKS FINALE
        // ══════════════════════════════════════════════════
        (() => {
            const canvas = document.getElementById('fw-canvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            let W = 0, H = 0;
            let fireworks = [];
            let rockets = [];
            let lastLaunch = 0;
            let running = true;

            const resize = () => {
                const rect = canvas.getBoundingClientRect();
                W = canvas.width = Math.max(1, Math.floor(rect.width * devicePixelRatio));
                H = canvas.height = Math.max(1, Math.floor(rect.height * devicePixelRatio));
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(devicePixelRatio, devicePixelRatio);
                W = rect.width;
                H = rect.height;
            };

            resize();
            window.addEventListener('resize', resize);

            const palettes = [
                ['#f5a623', '#fff5cc', '#d94f3d'],
                ['#fff1a8', '#f7816a', '#f5a623'],
                ['#ffd76a', '#fff8dc', '#dc143c'],
                ['#ffe7a0', '#f5a623', '#ff9f68']
            ];

            const launch = () => {
                const x = W * (.08 + Math.random() * .84);
                const targetY = H * (.12 + Math.random() * .48);
                rockets.push({
                    x,
                    y: H + 12,
                    targetY,
                    vy: -(7.5 + Math.random() * 3),
                    hue: palettes[Math.floor(Math.random() * palettes.length)]
                });
            };

            const explode = (x, y, palette) => {
                const count = 48 + Math.floor(Math.random() * 34);
                const power = 2.0 + Math.random() * 2.2;

                for (let i = 0; i < count; i++) {
                    const a = Math.random() * Math.PI * 2;
                    const speed = .6 + Math.random() * power;
                    fireworks.push({
                        x, y,
                        vx: Math.cos(a) * speed,
                        vy: Math.sin(a) * speed,
                        life: 1,
                        decay: .012 + Math.random() * .014,
                        size: 1.1 + Math.random() * 2.2,
                        color: palette[Math.floor(Math.random() * palette.length)]
                    });
                }
            };

            const draw = (now) => {
                if (!running) return;

                ctx.fillStyle = 'rgba(7,2,0,.19)';
                ctx.fillRect(0, 0, W, H);

                if (now - lastLaunch > 520 + Math.random() * 680) {
                    launch();
                    lastLaunch = now;
                }

                rockets.forEach((r, i) => {
                    r.y += r.vy;
                    r.vy += .08;

                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(255,226,125,.6)';
                    ctx.lineWidth = 1.5;
                    ctx.moveTo(r.x, r.y + 14);
                    ctx.lineTo(r.x, r.y);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.fillStyle = '#fff5bd';
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#f5a623';
                    ctx.arc(r.x, r.y, 2.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    if (r.y <= r.targetY) {
                        explode(r.x, r.y, r.hue);
                        rockets.splice(i, 1);
                    }
                });

                fireworks.forEach((p, i) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= .986;
                    p.vy *= .986;
                    p.vy += .025;
                    p.life -= p.decay;

                    if (p.life <= 0) {
                        fireworks.splice(i, 1);
                        return;
                    }

                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.beginPath();
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 9;
                    ctx.shadowColor = p.color;
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.globalAlpha = 1;
                requestAnimationFrame(draw);
            };

            // Respect reduced-motion while still leaving a beautiful static glow.
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                ctx.fillStyle = 'rgba(245,166,35,.08)';
                ctx.fillRect(0, 0, W, H);
            } else {
                requestAnimationFrame(draw);
            }

            document.addEventListener('visibilitychange', () => {
                running = !document.hidden;
                if (running && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    requestAnimationFrame(draw);
                }
            });
        })();

        // ══════════════════════════════════════════════════
        (() => {
            const c = document.getElementById('fw-canvas');
            const ctx = c.getContext('2d');
            let W, H, ps = [], on = false;
            const resize = () => { W = c.width = c.offsetWidth; H = c.height = c.offsetHeight };
            resize(); window.addEventListener('resize', resize);
            function launch() {
                const x = .1 * W + Math.random() * .8 * W, y = .1 * H + Math.random() * .5 * H;
                const n = 55 + Math.floor(Math.random() * 35), hue = Math.random() * 360;
                for (let i = 0; i < n; i++) {
                    const a = (Math.PI * 2 / n) * i, sp = 2.5 + Math.random() * 4.5;
                    ps.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: .013 + Math.random() * .012, size: 2 + Math.random() * 2.5, hue: hue + Math.random() * 40 });
                }
            }
            const tick = () => {
                if (!on) { requestAnimationFrame(tick); return; }
                ctx.fillStyle = 'rgba(10,3,0,.2)'; ctx.fillRect(0, 0, W, H);
                ps = ps.filter(p => {
                    p.x += p.vx; p.y += p.vy; p.vy += .07; p.vx *= .98; p.vy *= .98; p.life -= p.decay;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${p.hue},90%,65%,${p.life})`; ctx.fill();
                    return p.life > 0;
                });
                requestAnimationFrame(tick);
            }; tick();
            const fo = new IntersectionObserver(entries => {
                if (entries[0].isIntersecting && !on) { on = true; resize(); for (let i = 0; i < 7; i++)setTimeout(launch, i * 450); setInterval(launch, 1700); }
            }, { threshold: .25 });
            fo.observe(document.getElementById('fireworks-section'));
        })();
        // ══════════════════════════════════════════════════
        //  DISTANCE COUNTER — START 1 → N ON VIEWPORT ENTRY
        // ══════════════════════════════════════════════════
        (() => {
            const section = document.getElementById('fireworks-section');
            const dEl = document.getElementById('distKm');

            if (!section || !dEl) return;

            let started = false;
            const target = 1147;

            const startCounter = () => {
                if (started) return;
                started = true;

                const duration = 2200;
                const startTime = performance.now();

                const tick = (now) => {
                    const progress = Math.min(
                        1,
                        (now - startTime) / duration
                    );

                    // Smooth ease-out
                    const eased = 1 - Math.pow(1 - progress, 3);

                    // IMPORTANT: starts at 1, never 0
                    const value = Math.max(
                        1,
                        Math.round(1 + (target - 1) * eased)
                    );

                    dEl.textContent = value.toLocaleString('en-IN');

                    if (progress < 1) {
                        requestAnimationFrame(tick);
                    } else {
                        dEl.textContent = target.toLocaleString('en-IN');
                    }
                };

                // First visible value is 1
                dEl.textContent = '1';
                requestAnimationFrame(tick);
            };

            const observer = new IntersectionObserver(
                (entries, obs) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            startCounter();
                            obs.unobserve(entry.target);
                        }
                    });
                },
                {
                    threshold: 0.25,
                    rootMargin: '0px 0px -10% 0px'
                }
            );

            observer.observe(section);
        })();
</script>
