<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Raksha Bandhan 💛</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600;700&family=Dancing+Script:wght@700&display=swap"
        rel="stylesheet" />
    <style>
        /* ══ RESET ═════════════════════════════════════════════════ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f5a623;
            --crimson: #d94f3d;
            --rose: #f7816a;
            --cream: #fff8ee;
            --bg: #120600;
            --glow: 0 0 40px rgba(245, 166, 35, .5);
            --glow-sm: 0 0 18px rgba(245, 166, 35, .35);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--cream);
            overflow-x: hidden;
            cursor: none;
        }

        /* ══ CUSTOM CURSOR ═════════════════════════════════════════ */
        #cursor {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: radial-gradient(circle, #f5a623, #d94f3d);
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
            transition: transform .08s;
        }

        #cursor-ring {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1.5px solid rgba(245, 166, 35, .5);
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: left .1s, top .1s;
        }

        body * {
            cursor: none;
        }

        /* ══ DISABLE CUSTOM CURSOR ON TOUCH / MOBILE ═══════════════ */
        @media (pointer: coarse) {

            body,
            body * {
                cursor: auto !important;
            }

            #cursor,
            #cursor-ring {
                display: none !important;
            }
        }

        /* ══ CLICK BURST ════════════════════════════════════════════ */
        .burst {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9990;
            animation: burstFly .7s ease forwards;
        }

        @keyframes burstFly {
            to {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* ══ PETALS ════════════════════════════════════════════════ */
        #petals-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ══ NAV ═══════════════════════════════════════════════════ */
        .nav-dots {
            position: fixed;
            right: 22px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 13px;
            z-index: 500;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(245, 166, 35, .3);
            border: 1.5px solid var(--gold);
            cursor: pointer;
            transition: .3s;
        }

        .dot.active {
            background: var(--gold);
            transform: scale(1.4);
            box-shadow: var(--glow-sm);
        }

        /* ══ SECTIONS ══════════════════════════════════════════════ */
        section {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            overflow: hidden;
        }

        .section-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.2rem, 5vw, 3.6rem);
            color: var(--gold);
            margin-bottom: 50px;
            text-align: center;
            text-shadow: 0 0 24px #f5a62360;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* ══ SCROLL REVEAL ══════════════════════════════════════════ */
        .rv {
            opacity: 0;
            transform: translateY(50px);
            transition: opacity .9s ease, transform .9s cubic-bezier(.25, .8, .25, 1);
        }

        .rv-l {
            opacity: 0;
            transform: translateX(-60px);
            transition: opacity .9s ease, transform .9s cubic-bezier(.25, .8, .25, 1);
        }

        .rv-r {
            opacity: 0;
            transform: translateX(60px);
            transition: opacity .9s ease, transform .9s cubic-bezier(.25, .8, .25, 1);
        }

        .rv-s {
            opacity: 0;
            transform: scale(.82);
            transition: opacity .9s ease, transform .9s cubic-bezier(.34, 1.56, .64, 1);
        }

        .rv.show,
        .rv-l.show,
        .rv-r.show,
        .rv-s.show {
            opacity: 1;
            transform: none;
        }

        /* ═════════════════════════════════════════════════════════════
       INTRO SPLASH — RAKHI ANIMATION
    ═══════════════════════════════════════════════════════════════ */
        #intro {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #3b1900 0%, #120600 75%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            transition: opacity .8s ease, visibility .8s ease;
        }

        #intro.gone {
            opacity: 0;
            visibility: hidden;
        }

        /* Animated Rakhi charm */
        .intro-rakhi-wrap {
            width: 160px;
            height: 160px;
            background: conic-gradient(from 0deg, #8b1a1a, #c8922a, #f5a623, #fff8dc, #f5a623, #c8922a, #8b1a1a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: rakhi-spin 10s linear infinite;
            box-shadow: 0 0 60px rgba(245, 166, 35, .6);
        }

        .intro-rakhi-inner {
            width: 130px;
            height: 130px;
            background: radial-gradient(circle at 38% 38%, #fff8dc, #f5a623, #c77a1a 70%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.6rem;
            box-shadow: inset 0 0 30px rgba(255, 255, 255, .35);
            animation: rakhi-glow 2s ease infinite alternate;
        }

        @keyframes rakhi-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rakhi-glow {
            from {
                box-shadow: inset 0 0 30px rgba(255, 255, 255, .25), 0 0 30px #f5a62360;
            }

            to {
                box-shadow: inset 0 0 30px rgba(255, 255, 255, .55), 0 0 60px #f5a623cc;
            }
        }

        /* Thread stretching across intro */
        .intro-thread-wrap {
            position: relative;
            width: 320px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .intro-thread {
            height: 5px;
            background: linear-gradient(90deg, #dc143c, #f5a623, #dc143c, #f5a623, #dc143c);
            border-radius: 3px;
            width: 0;
            animation: threadStretch 1.4s cubic-bezier(.4, 0, .2, 1) .4s forwards;
        }

        @keyframes threadStretch {
            to {
                width: 100%;
            }
        }

        /* Knot nodes */
        .intro-knot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--gold);
            position: absolute;
            box-shadow: 0 0 10px #f5a623;
            animation: knotPop .5s cubic-bezier(.34, 1.56, .64, 1) forwards;
            transform: scale(0);
        }

        .intro-knot:nth-child(1) {
            left: 0;
            animation-delay: .6s;
        }

        .intro-knot:nth-child(2) {
            left: 50%;
            transform: translateX(-50%) scale(0);
            animation-delay: .9s;
            animation-name: knotPopMid;
        }

        .intro-knot:nth-child(3) {
            right: 0;
            animation-delay: 1.2s;
        }

        @keyframes knotPop {
            to {
                transform: scale(1);
            }
        }

        @keyframes knotPopMid {
            to {
                transform: translateX(-50%) scale(1);
            }
        }

        .intro-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.2rem, 6vw, 4rem);
            background: linear-gradient(135deg, #f5a623, #fff5cc, #d94f3d, #f5a623);
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradShift 3s ease infinite;
            text-align: center;
            opacity: 0;
            animation: gradShift 3s ease infinite, fadeUp .8s ease .3s forwards;
        }

        @keyframes gradShift {

            0%,
            100% {
                background-position: 0%
            }

            50% {
                background-position: 100%
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .intro-sub {
            font-family: 'Playfair Display', serif;
            font-size: clamp(.9rem, 2vw, 1.2rem);
            color: #ffe9b0cc;
            text-align: center;
            opacity: 0;
            animation: fadeUp .8s ease .7s forwards;
        }

        .intro-btn {
            margin-top: 10px;
            padding: 14px 44px;
            background: linear-gradient(135deg, #f5a623, #d94f3d);
            border: none;
            border-radius: 50px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.3rem;
            color: #fff;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 0 30px rgba(245, 166, 35, .5);
            opacity: 0;
            animation: fadeUp .8s ease 1.1s forwards;
            transition: transform .25s, box-shadow .25s;
        }

        .intro-btn:hover {
            transform: scale(1.07);
            box-shadow: 0 0 50px rgba(245, 166, 35, .8);
        }

        /* Sparkle dots on intro */
        .intro-spark {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, #f5a623, transparent);
            animation: sparkFloat linear infinite;
            pointer-events: none;
        }

        @keyframes sparkFloat {
            0% {
                transform: translateY(0) scale(1);
                opacity: .9;
            }

            100% {
                transform: translateY(-120px) scale(0);
                opacity: 0;
            }
        }

        /* ═════════════════════════════════════════════════════════════
       HERO
    ═══════════════════════════════════════════════════════════════ */
        #hero {
            background: radial-gradient(ellipse at 50% 60%, #3b1900, #120600 70%);
            text-align: center;
        }

        .lantern-string {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
        }

        .lantern {
            font-size: 2.2rem;
            animation: lSwing 2.5s ease-in-out infinite alternate;
            transform-origin: top center;
            filter: drop-shadow(0 4px 14px #f5a62388);
        }

        .lantern:nth-child(2) {
            animation-delay: .4s
        }

        .lantern:nth-child(3) {
            animation-delay: .8s
        }

        .lantern:nth-child(4) {
            animation-delay: 1.2s
        }

        .lantern:nth-child(5) {
            animation-delay: 1.6s
        }

        @keyframes lSwing {
            from {
                transform: rotate(-14deg)
            }

            to {
                transform: rotate(14deg)
            }
        }

        .diya-row {
            display: flex;
            gap: 28px;
            margin-bottom: 20px;
            animation: sway 3s ease-in-out infinite alternate;
        }

        .diya {
            font-size: 2.6rem;
            filter: drop-shadow(0 0 14px #f5a623cc);
        }

        @keyframes sway {
            from {
                transform: rotate(-5deg)
            }

            to {
                transform: rotate(5deg)
            }
        }

        .hero-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3rem, 9vw, 7rem);
            background: linear-gradient(135deg, #f5a623, #fff5cc, #d94f3d, #f5a623);
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradShift 4s ease infinite, hFade 1.5s ease forwards;
            opacity: 0;
            line-height: 1.1;
        }

        .hero-name {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2rem, 6vw, 4.5rem);
            color: #ffe0a0;
            opacity: 0;
            animation: hFade 1.5s ease .4s forwards;
            text-shadow: 0 0 30px #f5a62380;
        }

        .hero-sub {
            font-family: 'Playfair Display', serif;
            font-size: clamp(.95rem, 2.5vw, 1.4rem);
            color: #ffe9b0cc;
            margin-top: 14px;
            opacity: 0;
            animation: hFade 1.5s ease .8s forwards;
        }

        .hero-badge {
            margin-top: 30px;
            display: inline-block;
            padding: 12px 38px;
            border: 2px solid var(--gold);
            border-radius: 50px;
            font-size: .95rem;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            animation: hFade 1.5s ease 1.2s forwards;
            box-shadow: var(--glow);
            backdrop-filter: blur(6px);
        }

        @keyframes hFade {
            from {
                opacity: 0;
                transform: translateY(40px) scale(.95)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        /* ═════════════════════════════════════════════════════════════
       PHOTO GALLERY  — Proper card grid + featured viewer
    ═══════════════════════════════════════════════════════════════ */
        #gallery {
            background: linear-gradient(160deg, #1e0900, #3a1200, #120600);
            padding: 100px 20px;
        }

        /* --- Featured viewer (top) --- */
        .featured-wrap {
            width: min(860px, 95vw);
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 30px 80px rgba(0, 0, 0, .7), 0 0 0 2px rgba(245, 166, 35, .3);
            aspect-ratio: 16/9;
            margin-bottom: 30px;
        }

        .featured-wrap img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            transition: opacity .7s ease, transform .7s ease;
            transform: scale(1.03);
        }

        .featured-wrap img.f-active {
            opacity: 1;
            transform: scale(1);
            z-index: 2;
        }

        .featured-wrap img.f-hidden {
            opacity: 0;
            transform: scale(1.05);
            z-index: 1;
        }

        /* caption overlay */
        .featured-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 5;
            background: linear-gradient(to top, rgba(18, 6, 0, .9) 0%, transparent 100%);
            padding: 28px 24px 20px;
            pointer-events: none;
        }

        .featured-caption .fc-name {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.6rem, 4vw, 2.6rem);
            color: #fff;
            text-shadow: 0 2px 20px rgba(0, 0, 0, .8);
        }

        .featured-caption .fc-num {
            font-size: .82rem;
            letter-spacing: 2px;
            color: rgba(245, 166, 35, .8);
            margin-top: 4px;
        }

        /* Arrow buttons */
        .fv-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .45);
            border: 2px solid rgba(245, 166, 35, .5);
            color: var(--gold);
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background .3s, transform .3s, box-shadow .3s;
        }

        .fv-arrow:hover {
            background: var(--gold);
            color: #120600;
            transform: translateY(-50%) scale(1.12);
            box-shadow: var(--glow);
        }

        #fvPrev {
            left: 14px
        }

        #fvNext {
            right: 14px
        }

        /* Gold frame border overlay */
        .featured-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 3px solid rgba(245, 166, 35, .18);
            border-radius: 20px;
            z-index: 6;
            pointer-events: none;
        }

        /* --- Thumbnail row (below) --- */
        .thumb-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            width: min(860px, 95vw);
        }

        .thumb-card {
            position: relative;
            flex: 0 0 calc(20% - 10px);
            min-width: 100px;
            aspect-ratio: 3/4;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 2.5px solid transparent;
            transition: border-color .3s, transform .3s, box-shadow .3s;
            background: #000;
        }

        .thumb-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
            filter: brightness(.75) saturate(.9);
            transition: filter .35s, transform .35s;
        }

        .thumb-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(18, 6, 0, .6), transparent 60%);
        }

        .thumb-card:hover img {
            filter: brightness(1) saturate(1.1);
            transform: scale(1.06);
        }

        .thumb-card.active {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(245, 166, 35, .5);
        }

        .thumb-card.active img {
            filter: brightness(1) saturate(1.1);
        }

        .thumb-num {
            position: absolute;
            bottom: 7px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: .95rem;
            color: #fff;
            z-index: 2;
            text-shadow: 0 1px 6px rgba(0, 0, 0, .8);
        }

        /* ═════════════════════════════════════════════════════════════
       LIGHTBOX
    ═══════════════════════════════════════════════════════════════ */
        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(18, 6, 0, .96);
            z-index: 1500;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        #lightbox.open {
            display: flex;
            animation: fadeIn .3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        #lb-img {
            max-width: 92vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 0 80px rgba(245, 166, 35, .3);
            animation: zoomIn .35s cubic-bezier(.34, 1.56, .64, 1);
        }

        @keyframes zoomIn {
            from {
                transform: scale(.75);
                opacity: 0
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        #lb-close {
            position: absolute;
            top: 20px;
            right: 26px;
            font-size: 2.2rem;
            color: var(--gold);
            cursor: pointer;
            transition: transform .2s;
        }

        #lb-close:hover {
            transform: rotate(90deg) scale(1.2);
        }

        /* ═════════════════════════════════════════════════════════════
       RAKHI SECTION
    ═══════════════════════════════════════════════════════════════ */
        #rakhi-section {
            background: radial-gradient(ellipse at 30% 70%, #3b0f0f, #120600 60%);
            text-align: center;
        }

        /* .wrist-band { */
            /* width: 260px;
            height: 82px;
            background: linear-gradient(90deg, #7a3a0a, #c8922a, #f5c166, #c8922a, #7a3a0a);
            border-radius: 42px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 0, 0, .6), 0 0 0 3px rgba(245, 166, 35, .25); */
            .wrist-band {
    width: 353px;
    height: 20px;
    background: linear-gradient(90deg, #7a3a0a, #c8922a, #f5c166, #c8922a, #7a3a0a);
    border-radius: 42px;
    margin: 0 auto;
    position: relative;
    overflow: visible;
    box-shadow: 0 8px 40px rgba(0, 0, 0, .6), 0 0 0 3px rgba(245, 166, 35, .25);
}
        /* } */

        .wrist-band::before {
            content: '';
            position: absolute;
            top: 9px;
            left: 9px;
            right: 9px;
            bottom: 9px;
            border-radius: 34px;
            border: 2px solid rgba(255, 220, 100, .5);
        }

        .wrist-band::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(255, 255, 255, .18), transparent);
            border-radius: 42px;
        }

        .rakhi-charm {
            width: 90px;
            height: 90px;
            background: radial-gradient(circle at 35% 35%, #fff8dc, #f5a623, #c77a1a);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            box-shadow: 0 0 40px #f5a623bb, inset 0 0 18px rgba(255, 255, 255, .4);
            z-index: 3;
        }

        .rakhi-charm.go {
            animation: charmPop 1s cubic-bezier(.34, 1.56, .64, 1) forwards;
        }

        @keyframes charmPop {
            to {
                transform: translate(-50%, -50%) scale(1)
            }
        }

        .thread {
            height: 5px;
            background: linear-gradient(90deg, #dc143c, #f5a623, #dc143c, #f5a623, #dc143c);
            border-radius: 3px;
            margin: 0 auto;
            width: 0;
            position: relative;
            top: -4px;
        }

        .thread.go {
            animation: tGrow 1.4s ease .2s forwards;
        }

        @keyframes tGrow {
            to {
                width: 260px
            }
        }

        .rakhi-msg {

        ];

        const WISHES = [
            { icon: '🌸', title: 'Joy & Happiness', text: `May every morning bring fresh happiness to your heart,and every night be filled with peaceful dreams.` },
            { icon: '💰', title: 'Prosperity', text: `May abundance flow into your life — in love, health and every blessing you deserve.` },
            { icon: '🛡️', title: 'Protection', text: `Though miles apart, my prayers wrap around you like armor. May you always feel safe.` },
            { icon: '❤️', title: 'Endless Love', text: `Distance is just a number. My love for you,crosses every mile and every border.` },
            { icon: '🌟', title: 'Bright Future', text: `May every dream you've painted shine into reality — you deserve all the stars.` },
            { icon: '🏠', title: 'Reunion Soon', text: `One day soon we'll celebrate together in person. Until then, this Rakhi carries all my hugs.` },
        ];

        // ══════════════════════════════════════════════════
        //  FILL TEXT
        // ══════════════════════════════════════════════════
        document.title = `Happy Raksha Bandhan 💛 My Cutest Sister ${SIS_NAME}`;
        document.getElementById('introTitle').textContent = `Happy Raksha Bandhan`;
        document.getElementById('introSub').textContent = `For my cutest sister ${SIS_NAME} 🌺`;
        document.getElementById('heroName').textContent = `My Cutest Chocolaty Sister ${SIS_NAME} 🌺`;
        document.getElementById('heroSub').textContent = `With all my love from across every mile on this Raksha Bandhan`;
        document.getElementById('galTitle').textContent = `✨ ${SIS_NAME}'s Precious Memories 📸`;
        document.getElementById('wishName').textContent = SIS_NAME;
        document.getElementById('bigWish').textContent = ` Happy Rakhi ${SIS_NAME} `;
        document.getElementById('rMsg').innerHTML =
            `This Rakhi thread is more than silk and colors — it carries the warmth of my heart, the prayers of my soul, and the promise that no distance can weaken the bond we share. I tie this Rakhi across every mile that separates us.`;
        document.getElementById('letterEnv').innerHTML = `
  <p class="lt">
    Dear <span class="hl">${SIS_NAME}</span>,<br/><br/>
    Today the world celebrates Raksha Bandhan, and <span class="hl">even though miles lay between us</span>,
    my heart has traveled every one of them just to reach you. 🌸<br/><br/>
    I close my eyes and I can see you smiling that radiant & warm smile
    that makes everything feel okay. I tie this Rakhi <span class="hl">on my wrist, across the distance</span>,
    with a prayer that you stay surrounded by love, laughter, and every happiness you deserve.<br/><br/>
    Distance can separate our bodies, but <span class="hl">it can never separate our hearts</span>.
    You are my guiding star, my biggest cheerleader, my forever safe place. On this special day,
    I promise to always be there for you — in every way I can, from wherever I am.<br/><br/>
    May this Raksha Bandhan bring you all the joy you deserve. 🪔
    <span class="hl">You are always in my prayers, always in my heart.
  </p>
  <div class="lt-sig">Your Brother 💛</div>
`;
        document.getElementById('footer').innerHTML =
            `Made with <span class="heart">♥</span> for <span class="sis">${SIS_NAME}</span> &nbsp;·&nbsp; Raksha Bandhan 2026 &nbsp;·&nbsp; 🪔 May our bond shine forever`;

        // ══════════════════════════════════════════════════
        //  INTRO — sparkle particles
        // ══════════════════════════════════════════════════
        const intro = document.getElementById('intro');
        for (let i = 0; i < 22; i++) {
            const s = document.createElement('div');
            s.className = 'intro-spark';
            const sz = 4 + Math.random() * 8;
            Object.assign(s.style, {
                width: sz + 'px', height: sz + 'px',
                left: Math.random() * 100 + '%',
                top: (30 + Math.random() * 60) + '%',
                animationDuration: (1.5 + Math.random() * 2.5) + 's',
                animationDelay: Math.random() + 's',
            });
            intro.appendChild(s);
        }

        const introAudio = document.getElementById('introMusic');
        const audio = document.getElementById('bgMusic');

        // Attempt autoplay on load
        introAudio.play().catch(e => console.log('Intro autoplay blocked on load', e));

        // Autoplay intro music on first interaction if blocked
        const startIntroMusic = () => {
            if (!intro.classList.contains('gone') && introAudio.paused) {
                introAudio.play().catch(e => console.log('Intro autoplay pending interaction', e));
            }
            document.removeEventListener('click', startIntroMusic);
            document.removeEventListener('touchstart', startIntroMusic);
        };
        document.addEventListener('click', startIntroMusic);
        document.addEventListener('touchstart', startIntroMusic);

        document.getElementById('introBtn').addEventListener('click', (e) => {
            e.stopPropagation(); // prevent re-triggering intro music
            intro.classList.add('gone');
            setTimeout(() => intro.remove(), 900);

            // Swap intro music for main background music
            introAudio.pause();
            introAudio.currentTime = 0;
            audio.play().catch(e => console.log('Audio autoplay blocked', e));
        });

        // ══════════════════════════════════════════════════
        //  MUSIC TOGGLE LOGIC
        // ══════════════════════════════════════════════════
        const mToggle = document.getElementById('musicToggle');

        mToggle.addEventListener('click', () => {
            // Check if intro is still active to toggle introMusic instead
            if (!intro.classList.contains('gone')) {
                if (introAudio.paused) {
                    introAudio.play();
                    mToggle.textContent = '🔊';
                } else {
                    introAudio.pause();
                    mToggle.textContent = '🔇';
                }
            } else {
                if (audio.paused) {
                    audio.play();
                    mToggle.textContent = '🔊';
                } else {
                    audio.pause();
                    mToggle.textContent = '🔇';
                }
            }
        });

        // ══════════════════════════════════════════════════
        //  CUSTOM CURSOR  (desktop only — disabled on touch)
        // ══════════════════════════════════════════════════
        const isTouch = window.matchMedia('(pointer: coarse)').matches;
        const cur = document.getElementById('cursor'), ring = document.getElementById('cursor-ring');
        if (!isTouch) {
            document.addEventListener('mousemove', e => {
                cur.style.left = ring.style.left = e.clientX + 'px';
                cur.style.top = ring.style.top = e.clientY + 'px';
            });
            document.addEventListener('mousedown', () => cur.style.transform = 'translate(-50%,-50%) scale(.6)');
            document.addEventListener('mouseup', () => cur.style.transform = 'translate(-50%,-50%) scale(1)');
        }

        // ══════════════════════════════════════════════════
        //  CLICK BURST
        // ══════════════════════════════════════════════════
        const bColors = ['#f5a623', '#d94f3d', '#f7816a', '#ffe0b2', '#fff5cc', '#dc143c'];
        document.addEventListener('click', e => {
            for (let i = 0; i < 14; i++) {
                const p = document.createElement('div');
                p.className = 'burst';
                const sz = 5 + Math.random() * 8, a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 90;
                p.style.cssText = `left:${e.clientX}px;top:${e.clientY}px;width:${sz}px;height:${sz}px;
      background:${bColors[Math.floor(Math.random() * bColors.length)]};
      --tx:${Math.cos(a) * d}px;--ty:${Math.sin(a) * d}px;
      animation-duration:${.5 + Math.random() * .5}s;`;
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }
        });

        // ══════════════════════════════════════════════════
        //  PETALS
        // ══════════════════════════════════════════════════
        (() => {
            const c = document.getElementById('petals-canvas');
            const ctx = c.getContext('2d');
            let W, H, ps = [];
            const shapes = ['🌸', '🍂', '✨', '🌺', '🪷', '🌼'];
            const resize = () => { W = c.width = window.innerWidth; H = c.height = window.innerHeight };
            resize(); window.addEventListener('resize', resize);
            const sp = () => ({ x: Math.random() * W, y: -30, size: 12 + Math.random() * 16, vy: .5 + Math.random() * 1.1, vx: (Math.random() - .5) * .7, rot: Math.random() * Math.PI * 2, rs: (Math.random() - .5) * .03, em: shapes[Math.floor(Math.random() * shapes.length)], a: .5 + Math.random() * .4 });
            for (let i = 0; i < 34; i++) { const p = sp(); p.y = Math.random() * H; ps.push(p); }
            const tick = () => {
                ctx.clearRect(0, 0, W, H);
                if (ps.length < 36 && Math.random() < .04) ps.push(sp());
                ps.forEach((p, i) => {
                    ctx.save(); ctx.globalAlpha = p.a; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                    ctx.font = p.size + 'px serif'; ctx.fillText(p.em, -p.size / 2, p.size / 2); ctx.restore();
                    p.y += p.vy; p.x += p.vx + Math.sin(p.y * .01) * .5; p.rot += p.rs;
                    if (p.y > H + 40) ps[i] = sp();
                });
                requestAnimationFrame(tick);
            }; tick();
        })();

        // ══════════════════════════════════════════════════
        //  NAV DOTS
        // ══════════════════════════════════════════════════
        const SECS = ['hero', 'gallery', 'rakhi-section', 'letter-section', 'wishes', 'fireworks-section'];
        const nav = document.getElementById('navDots');
        SECS.forEach((id, i) => {
            const d = document.createElement('div');
            d.className = 'dot' + (i === 0 ? ' active' : '');
            d.onclick = () => document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
            nav.appendChild(d);
        });
        const dots = nav.querySelectorAll('.dot');
        const sObs = new IntersectionObserver(entries => {
            entries.forEach(e => { if (e.isIntersecting) { const i = SECS.indexOf(e.target.id); dots.forEach((d, j) => d.classList.toggle('active', i === j)); } });
        }, { threshold: .4 });
        SECS.forEach(id => sObs.observe(document.getElementById(id)));

        // ══════════════════════════════════════════════════
        //  SCROLL REVEAL
        // ══════════════════════════════════════════════════
        const rObs = new IntersectionObserver(entries => {
            entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('show'); rObs.unobserve(e.target); } });
        }, { threshold: .12 });
        document.querySelectorAll('.rv,.rv-l,.rv-r,.rv-s').forEach(el => rObs.observe(el));

        // ══════════════════════════════════════════════════
        //  GALLERY — FEATURED VIEWER
        // ══════════════════════════════════════════════════
        (() => {
            const fw = document.getElementById('featuredWrap');
            const tr = document.getElementById('thumbRow');
            const fcN = document.getElementById('fcName');
            const fcNum = document.getElementById('fcNum');
            let cur = 0;

            // preload + build images
            const imgs = PHOTOS.map((p, i) => {
                const el = document.createElement('img');
                el.src = p.src; el.alt = p.caption;
                el.className = i === 0 ? 'f-active' : 'f-hidden';
                el.addEventListener('click', () => openLB(p.src));
                el.style.cssText = 'cursor:zoom-in;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;transition:opacity .7s ease,transform .7s ease;';
                // insert before arrows
                fw.insertBefore(el, document.getElementById('fvPrev'));
                return el;
            });

            // thumbnails
            const thumbs = PHOTOS.map((p, i) => {
                const card = document.createElement('div');
                card.className = 'thumb-card' + (i === 0 ? ' active' : '');
                const img = document.createElement('img');
                img.src = p.src; img.alt = p.caption;
                const num = document.createElement('div');
                num.className = 'thumb-num';
                num.textContent = p.caption;
                card.appendChild(img); card.appendChild(num);
                card.addEventListener('click', () => goTo(i));
                tr.appendChild(card);
                return card;
            });

            function updateCaption() {
                fcN.textContent = PHOTOS[cur].caption;
                fcNum.textContent = `${cur + 1} of ${PHOTOS.length}`;
            }
            updateCaption();

            function goTo(idx) {
                imgs[cur].className = ''; imgs[cur].style.opacity = '0'; imgs[cur].style.transform = 'scale(1.04)'; imgs[cur].style.zIndex = '1';
                thumbs[cur].classList.remove('active');
                cur = (idx + PHOTOS.length) % PHOTOS.length;
                imgs[cur].className = ''; imgs[cur].style.opacity = '1'; imgs[cur].style.transform = 'scale(1)'; imgs[cur].style.zIndex = '2';
                thumbs[cur].classList.add('active');
                updateCaption();
            }

            document.getElementById('fvPrev').onclick = e => { e.stopPropagation(); goTo(cur - 1); };
            document.getElementById('fvNext').onclick = e => { e.stopPropagation(); goTo(cur + 1); };
            setInterval(() => goTo(cur + 1), 4200);
            document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') goTo(cur - 1); if (e.key === 'ArrowRight') goTo(cur + 1); if (e.key === 'Escape') closeLB(); });
        })();

        // ══════════════════════════════════════════════════
        //  LIGHTBOX
        // ══════════════════════════════════════════════════
        const lb = document.getElementById('lightbox');
        const lbImg = document.getElementById('lb-img');
        function openLB(src) { lbImg.src = src; lb.classList.add('open'); document.body.style.overflow = 'hidden'; }
        function closeLB() { lb.classList.remove('open'); document.body.style.overflow = ''; }
        document.getElementById('lb-close').onclick = closeLB;
        lb.addEventListener('click', e => { if (e.target === lb) closeLB(); });

        // ══════════════════════════════════════════════════
        //  RAKHI on scroll
        // ══════════════════════════════════════════════════
        const rObs2 = new IntersectionObserver(entries => {
            if (entries[0].isIntersecting) {
                document.getElementById('rThread').classList.add('go');
                document.getElementById('rCharm').classList.add('go');
                rObs2.disconnect();
            }
        }, { threshold: .3 });
        rObs2.observe(document.getElementById('rakhi-section'));

        // ══════════════════════════════════════════════════
        //  WISHES GRID
        // ══════════════════════════════════════════════════
        const wg = document.getElementById('wishGrid');
        WISHES.forEach((w, i) => {
            const c = document.createElement('div');
            c.className = 'wish-card rv';
            c.style.transitionDelay = (i * .11) + 's';
            c.innerHTML = `<span class="wish-icon">${w.icon}</span><div class="wish-title">${w.title}</div><p class="wish-text">${w.text}</p>`;
            wg.appendChild(c);
            rObs.observe(c);
        });

        // ══════════════════════════════════════════════════
        //  FIREWORKS
        // ══════════════════════════════════════════════════
        (() => {
            const c = document.getElementById('fw-canvas');
            const ctx = c.getContext('2d');
            let W, H, ps = [], on = false;
            const resize = () => { W = c.width = c.offsetWidth; H = c.height = c.offsetHeight };
            resize(); window.addEventListener('resize', resize);
            function launch() {
                const x = .1 * W + Math.random() * .8 * W, y = .1 * H + Math.random() * .5 * H;
                const n = 55 + Math.floor(Math.random() * 35), hue = Math.random() * 360;
                for (let i = 0; i < n; i++) {
                    const a = (Math.PI * 2 / n) * i, sp = 2.5 + Math.random() * 4.5;
                    ps.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: .013 + Math.random() * .012, size: 2 + Math.random() * 2.5, hue: hue + Math.random() * 40 });
                }
            }
            const tick = () => {
                if (!on) { requestAnimationFrame(tick); return; }
                ctx.fillStyle = 'rgba(10,3,0,.2)'; ctx.fillRect(0, 0, W, H);
                ps = ps.filter(p => {
                    p.x += p.vx; p.y += p.vy; p.vy += .07; p.vx *= .98; p.vy *= .98; p.life -= p.decay;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${p.hue},90%,65%,${p.life})`; ctx.fill();
                    return p.life > 0;
                });
                requestAnimationFrame(tick);
            }; tick();
            const fo = new IntersectionObserver(entries => {
                if (entries[0].isIntersecting && !on) { on = true; resize(); for (let i = 0; i < 7; i++)setTimeout(launch, i * 450); setInterval(launch, 1700); }
            }, { threshold: .25 });
            fo.observe(document.getElementById('fireworks-section'));
        })();

        // ══════════════════════════════════════════════════
        //  DISTANCE COUNTER
        // ══════════════════════════════════════════════════
        let cs = false;
        const dEl = document.getElementById('distKm');
        const co = new IntersectionObserver(entries => {
            if (entries[0].isIntersecting && !cs) { cs = true; let v = 0; const t = 1147; const s = () => { v += Math.ceil((t - v) / 16); dEl.textContent = v.toLocaleString(); if (v < t) requestAnimationFrame(s); else dEl.textContent = t.toLocaleString(); }; s(); }
        }, { threshold: .4 });
        co.observe(document.getElementById('fireworks-section'));
    </script>
</body>

</html>
